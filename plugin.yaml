name: plugin_foundry
label: Plugin Foundry
kind: standalone
manifest_version: 1
version: 0.1.0
description: >
  Turn a narrow plugin request into a native Hermes plugin with a manifest,
  entry point, tool, SQLite state and tests. Generated code is reviewed before
  install or catalog submission; nothing is auto-merged.
author: Iyanda Abdulqodir Adedolapo
license: MIT
requires_hermes: ">=0.21.5"
provides_tools:
  - foundry_plan
  - foundry_build
  - foundry_test
  - foundry_list
  - foundry_catalog
